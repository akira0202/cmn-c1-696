# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block (that shape is invisible to the registry: namespace/enabled fall
# back to defaults and name/version never resolve).
id: "CMN-C1-696"
name: "EntraIDGroupAssignAgent"
namespace: "cmn-c1-696"
version: "0.1.0"
enabled: true
category: "Cat 1"
industry: "CMN"

# L1-direct (no Level 2 base — L2 retired). ToolCallingAgent is a pattern reference only
# (docs/02 Decision Record), not an inheritance target.
base_type: "Other"

# Generation contract of the deployed agent. input_parse extracts the user, group and
# justification from the natural-language instruction with an LLM (Azure OpenAI), so the
# deployed agent is "llm", not "deterministic".
generation_mode: "llm"  # deterministic | llm

# Entry point — single dotted import path (module.Class). AgentRegistry does
# manifest["class"].rsplit(".", 1) to get (module, class_name).
class: "src.graph.graph.EntraIDGroupAssignAgentGraph"

# Security — INTERNAL: all 5 domain nodes declare required_trust_level = INTERNAL
# (privileged IAM write); a VERIFIED_EXTERNAL caller would be denied at every node.
required_trust_level: "INTERNAL"

# Compile-time gates — declare every secret/extra actually used. The client secret is
# provisioned to the secret store and resolved at runtime via
# ctx.secrets.require("ENTRA_CLIENT_SECRET") in the resolve / member-add nodes.
# Never place the secret value in this file or in State.
# extras names the framework extra the LLM client imports. The client is still constructed
# inside the call path, not at startup.
requires:
  secrets:
    - ENTRA_CLIENT_SECRET
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_DEPLOYMENT
  extras:
    - openai

# Runtime parameters (max_retry, timeout_seconds) live in config/config.yaml, which
# AgentRegistry loads separately and passes as Graph(config=...).
